<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biometric Blood Group Scanner</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        :root {
            --scanner-color: #00ff41; /* Classic Matrix/Scanner Green */
        }
        body { background-color: #121212; color: white; }
        .card { background-color: #1e1e1e; border: 1px solid #333; }
        
        /* Scanner Container */
        .scanner-window {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 20px auto;
            border: 2px solid #444;
            background: #000;
            overflow: hidden;
            display: none; /* Hidden until image is uploaded */
        }

        .preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
        }

        /* The Laser Line */
        .laser {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--scanner-color);
            box-shadow: 0 0 15px var(--scanner-color);
            z-index: 10;
            display: none;
        }

        .scanning .laser {
            display: block;
            animation: scan 2s infinite ease-in-out;
        }

        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }

        .status-text { font-family: 'Courier New', Courier, monospace; color: var(--scanner-color); }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-header bg-dark text-center border-bottom border-secondary">
                        <h3 class="text-info">FINGERPRINT ANALYZER</h3>
                    </div>
                    <div class="card-body text-center">
                        <div class="mb-4">
                            <label for="imageInput" class="form-label text-secondary">Upload high-res fingerprint</label>
                            <input type="file" id="imageInput" class="form-control bg-dark text-white border-secondary" accept="image/*">
                        </div>

                        <div id="scannerWrapper" class="scanner-window">
                            <img id="preview" class="preview-img" src="#" alt="Preview">
                            <div class="laser"></div>
                        </div>

                        <button id="scanBtn" onclick="uploadImage()" class="btn btn-outline-info w-100 py-2 mt-3">
                            INITIALIZE SCAN
                        </button>

                        <div id="status" class="status-text mt-3" style="display: none;">SYSTEM: PROCESSING DATA...</div>
                        <hr class="border-secondary">
                        <div id="result" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        const scannerWrapper = document.getElementById('scannerWrapper');
        const scanBtn = document.getElementById('scanBtn');
        const statusText = document.getElementById('status');
        const resultDiv = document.getElementById('result');

        // Show preview when file is selected
        imageInput.onchange = evt => {
            const [file] = imageInput.files;
            if (file) {
                preview.src = URL.createObjectURL(file);
                scannerWrapper.style.display = 'block';
                resultDiv.innerHTML = '';
            }
        }

        async function uploadImage() {
            if (!imageInput.files[0]) {
                alert("Please select a fingerprint image first.");
                return;
            }

            // UI State: Scanning
            scannerWrapper.classList.add('scanning');
            scanBtn.disabled = true;
            statusText.style.display = 'block';
            resultDiv.innerHTML = '';

            const formData = new FormData();
            formData.append('file', imageInput.files[0]);

            try {
                const response = await fetch('/predict', { method: 'POST', body: formData });
                const data = await response.json();

                // Stop animation
                scannerWrapper.classList.remove('scanning');
                statusText.style.display = 'none';
                scanBtn.disabled = false;

                // Display Result
                resultDiv.innerHTML = `
                    <div class="card bg-black border-info">
                        <div class="card-body text-info">
                            <h4 class="mb-1">${data.blood_group}</h4>
                            <p class="mb-0 small">Confidence: ${data.confidence}</p>
                            <p class="mb-0 x-small text-secondary">Pattern: ${data.pattern_type}</p>
                        </div>
                    </div>
                `;

            } catch (error) {
                console.error("Error:", error);
                scannerWrapper.classList.remove('scanning');
                statusText.style.display = 'none';
                scanBtn.disabled = false;
                resultDiv.innerHTML = `<div class="text-danger">CORE SYSTEM ERROR: Check Backend Connection</div>`;
            }
        }
    </script>
</body>
</html>
